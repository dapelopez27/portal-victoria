<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Victoria</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
<meta name="description" content="Videos y ejercicios para preparar el diagnóstico de 3ro primaria.">
<style>
  /* Tablero de práctica: saludo + avance arriba, tarjetas de temas en cuadrícula, una pregunta a la vez. */
  :root { --bg:#fff8ee; --card:#fff; --ink:#2b2340; --muted:#6b6480; --mate:#3b6fd4; --leng:#c94468; --on:#fff;
    --ok:#1f9d55; --bad:#e8833a; --star:#f5b301; --line:#eadfce; --track:#eee4d4; --soft:#f6f1ff;
    --okbg:#d8f3e2; --badbg:#ffe8d6; --fbmal:#fff1e4; --tagbg:#ffe4d1; --tagfg:#a34a0b; --tagokfg:#156b3a;
    --suj:#dce7ff; --colline:#cfd6e6; --sec:#efe6d8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1726; --card:#262036; --ink:#f1ecfa; --muted:#b2a9c6; --mate:#86a8f2; --leng:#f07b9a; --on:#14111d;
    --ok:#4cc483; --bad:#f0a066; --star:#f5c542; --line:#3a3250; --track:#3a3250; --soft:#2f2842;
    --okbg:#1d3b2b; --badbg:#43301f; --fbmal:#3a2b1e; --tagbg:#4a2e1c; --tagfg:#ffc79d; --tagokfg:#8fe0b0;
    --suj:#24345e; --colline:#4a4266; --sec:#3a3250; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#1b1726; --card:#262036; --ink:#f1ecfa; --muted:#b2a9c6; --mate:#86a8f2; --leng:#f07b9a; --on:#14111d;
    --ok:#4cc483; --bad:#f0a066; --star:#f5c542; --line:#3a3250; --track:#3a3250; --soft:#2f2842;
    --okbg:#1d3b2b; --badbg:#43301f; --fbmal:#3a2b1e; --tagbg:#4a2e1c; --tagfg:#ffc79d; --tagokfg:#8fe0b0;
    --suj:#24345e; --colline:#4a4266; --sec:#3a3250; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding-block:16px 60px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size:30px; margin:8px 0 4px; text-wrap:balance; } h2 { font-size:24px; margin:22px 0 10px; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; border-radius:16px; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--mate); outline-offset:2px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .estrellas { background:var(--card); border:2px solid var(--star); border-radius:999px; padding:6px 14px; font-weight:700; }
  .barra { height:14px; background:var(--track); border-radius:99px; overflow:hidden; } .barra i { display:block; height:100%; background:linear-gradient(90deg,var(--star),var(--ok)); border-radius:99px; transition:width .5s; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .tema { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:14px; text-align:left; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .tema:hover { transform:translateY(-2px); } .tema .e { font-size:34px; } .tema b { font-size:19px; }
  .tag { align-self:flex-start; font-size:13px; font-weight:700; padding:2px 10px; border-radius:99px; background:var(--tagbg); color:var(--tagfg); }
  .tag.ok { background:var(--okbg); color:var(--tagokfg); }
  .mate .barra i { background:var(--mate); } .leng .barra i { background:var(--leng); }
  .panel { background:var(--card); border:2px solid var(--line); border-radius:22px; padding:20px; min-width:0; overflow-x:auto; }
  .btn { background:var(--mate); color:var(--on); padding:14px 22px; font-weight:700; font-size:20px; }
  .btn.sec { background:var(--sec); color:var(--ink); } .btn.leng { background:var(--leng); } .btn.peligro { background:var(--bad); color:var(--on); }
  .acciones { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .op { display:block; width:100%; text-align:left; background:var(--soft); border:3px solid transparent; padding:14px 16px; margin:8px 0; font-size:20px; }
  .op:disabled { color:var(--ink); cursor:default; }
  .op.ok { background:var(--okbg); border-color:var(--ok); } .op.mal { background:var(--badbg); border-color:var(--bad); }
  input.num { font:inherit; font-size:28px; width:180px; max-width:100%; padding:10px 14px; border:3px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); }
  .fb { margin-top:14px; padding:14px; border-radius:16px; } .fb.ok { background:var(--okbg); } .fb.mal { background:var(--fbmal); }
  .puntos { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; } .puntos span { width:22px; height:22px; border-radius:50%; background:var(--track); }
  .puntos .ok { background:var(--ok); } .puntos .mal { background:var(--bad); } .puntos .ya { outline:3px solid var(--mate); }
  .grande { font-size:30px; font-weight:800; letter-spacing:.5px; }
  .tabla { border-collapse:collapse; margin:10px 0; } .tabla td { border:2px solid var(--line); padding:6px 10px; }
  .grande-t td { font-size:26px; font-weight:800; text-align:center; min-width:52px; }
  table.col { border-collapse:collapse; margin:12px 0; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; } table.col td { width:44px; height:44px; text-align:center; border:2px solid var(--colline); }
  table.col tr.ln td { border-top:4px solid var(--ink); }
  .suj { background:var(--suj); padding:2px 6px; border-radius:6px; } .pred { background:var(--okbg); padding:2px 6px; border-radius:6px; }
  .frac { display:block; margin:10px 0; max-width:100%; height:auto; }
  video { width:100%; max-width:100%; border-radius:16px; background:#000; margin:10px 0; }
  .fiesta { position:fixed; inset:0; pointer-events:none; overflow:hidden; } .fiesta span { position:absolute; top:-40px; font-size:30px; animation:cae 1.8s ease-in forwards; }
  @keyframes cae { to { transform:translateY(110vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .fiesta { display:none; } .tiempo i { animation:none; } .tema:hover { transform:none; } .barra i { transition:none; } }
  .papa td, .papa th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; font-size:16px; }
  .papa { border-collapse:collapse; width:100%; }
  .reto-card { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; width:100%; text-align:left; margin-top:16px; background:var(--card); border:3px solid var(--star); border-radius:22px; padding:16px 18px; }
  .reto-card b { font-size:22px; } .reto-card .racha { font-size:28px; font-weight:900; white-space:nowrap; }
  .mision-card { border-color:var(--leng); border-width:4px; } .mision-card b { font-size:26px; }
  .examen-card { border-color:var(--mate); margin-top:10px; }
  .op.sel { border-color:var(--mate); background:var(--suj); }
  .puntos .r { background:var(--mate); }
  .revision { border-top:2px solid var(--line); padding-top:12px; margin-top:12px; }
  .reto-q { font-size:64px; font-weight:900; text-align:center; font-variant-numeric:tabular-nums; margin:6px 0; }
  .pantalla { font-size:48px; font-weight:900; text-align:center; min-height:72px; border:3px solid var(--line); border-radius:16px; background:var(--card); font-variant-numeric:tabular-nums; }
  .teclado { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; max-width:420px; margin-inline:auto; }
  .teclado button { font-size:32px; font-weight:800; padding:14px 0; background:var(--soft); }
  .teclado .listo { background:var(--ok); color:var(--on); } .teclado .borra { background:var(--sec); }
  .tiempo { height:10px; background:var(--track); border-radius:99px; overflow:hidden; margin:8px 0 14px; }
  .tiempo i { display:block; height:100%; width:100%; background:var(--star); transform-origin:left; animation:reloj 6s linear forwards; }
  @keyframes reloj { to { transform:scaleX(0); } }
  .mapa { border-collapse:separate; border-spacing:3px; margin:8px auto; font-variant-numeric:tabular-nums; }
  .mapa th { font-size:13px; color:var(--muted); padding:0 4px; } .mapa td { width:28px; height:26px; border-radius:6px; background:var(--track); }
  .mapa td.c0 { background:var(--bad); } .mapa td.c1, .mapa td.c2 { background:var(--star); } .mapa td.c3, .mapa td.c4 { background:var(--okbg); outline:2px solid var(--ok); } .mapa td.c5 { background:var(--ok); }
  .leyenda { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; font-size:14px; color:var(--muted); }
  .leyenda span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; background:var(--c); }
  .nota { font-size:14px; color:var(--muted); }
  .ayudas { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; } .voz, .pistab { font-size:17px; padding:10px 16px; }
  .pista { margin-top:10px; padding:12px 14px; border-radius:14px; background:var(--tagbg); color:var(--ink); }
  .link { background:none; color:var(--muted); text-decoration:underline; padding:4px; font-size:15px; }
  @media (max-width:480px) { body { font-size:17px; } .grande { font-size:26px; } h1 { font-size:26px; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="fiesta" id="fiesta"></div>
<script src="logica.js?v=20261031b"></script>
<script>
const $ = (s) => document.querySelector(s), app = $('#app');
const RONDA = 5, CLAVE = 'portal-victoria-v1';
const BIEN = ['¡Muy bien, Victoria! ⭐', '¡Eso es! 🎉', '¡Excelente! 💪', '¡Lo lograste! 🌟', '¡Qué inteligente! 🧠', '¡Súper! 🚀'];
const CASI = ['¡Casi! Mira cómo se hace 👀', 'No pasa nada, así se aprende 💛', 'Vamos a verlo juntas paso a paso 👣'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// Avance guardado en este aparato (si el navegador lo bloquea, funciona igual sin guardar)
function cargar() { try { return JSON.parse(localStorage.getItem(CLAVE)) || null; } catch { return null; } }
let E = cargar() || { temas: {}, estrellas: 0, historial: [] };
E.reto = E.reto || { est: {}, dias: [], hist: [] };
E.examenes = E.examenes || [];
let GUARDA = true;
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(E)); GUARDA = true; } catch { GUARDA = false; } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
const avance = (id) => Math.min(100, Math.round(((E.temas[id] || {}).mejor || 0) / RONDA * 100));
const general = () => Math.round(L.TEMAS.reduce((s, t) => s + avance(t.id), 0) / L.TEMAS.length);

// 🔊 Lee en voz alta (voz del propio iPad, sin internet)
function hablar(html) {
  try {
    const t = document.createElement('div'); t.innerHTML = html;
    const texto = t.textContent.replace(/÷/g, ' entre ').replace(/×/g, ' por ').replace(/−/g, ' menos ').replace(/=\s*\?/g, ' es igual a... ').replace(/=/g, ' es igual a ').replace(/_+/g, ' cuánto ').replace(/🧠.*$/s, '');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto); u.lang = 'es-MX'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find((x) => /^es[-_](MX|US|419)/i.test(x.lang)) || speechSynthesis.getVoices().find((x) => /^es/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}
const botonVoz = '<button class="btn sec voz" id="voz" aria-label="Escuchar la pregunta">🔊 Escuchar</button>';

function fiesta(n = 30) {
  const f = $('#fiesta');
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.textContent = pick(['⭐', '🎉', '✨', '💛', '🌟', '🎈']);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.6 + 's';
    f.appendChild(s); setTimeout(() => s.remove(), 2600);
  }
}

function inicio() {
  const tarjeta = (t) => {
    const a = avance(t.id);
    return `<button class="tema ${t.materia}" data-id="${t.id}">
      <span class="e" aria-hidden="true">${t.emoji}</span><b>${t.nombre}</b>
      ${a >= 100 ? '<span class="tag ok">🏅 ¡Dominado!</span>' : t.urge ? `<span class="tag">${['division', 'problemas', 'mental'].includes(t.id) ? 'Empieza aquí' : 'Repasar'}</span>` : ''}
      <span class="barra"><i style="width:${a}%"></i></span><small>${a}%</small></button>`;
  };
  const g = general(), ri = retoInfo();
  app.innerHTML = `
    <div class="top"><h1>¡Hola, Victoria! 👋</h1><span class="estrellas">⭐ ${E.estrellas} estrellas</span></div>
    <p>Llevas <b>${g}%</b> del camino para tu examen de 3ro primaria.</p>
    <div class="barra"><i style="width:${g}%"></i></div>
    ${(() => { const m = hoyMision(); return `<button class="reto-card mision-card" id="mision"><span><b>🗺️ Misión del día</b><br>${m.cumplida ? '¡Cumplida! 🏆 Vuelve mañana' : `Paso ${m.hechos.length + 1} de 3 · unos 15 minutos`}</span><span class="racha">${'✅'.repeat(m.hechos.length)}${'⬜'.repeat(3 - m.hechos.length)}</span></button>`; })()}
    <button class="reto-card" id="reto"><span><b>⚡ Reto del día: tablas</b><br>${ri.hecho ? 'Hecho hoy ✅ ¿Otra vuelta?' : '10 tablas · unos 3 minutos'} · ${ri.vistas} de 90 practicadas</span><span class="racha">🔥 ${ri.racha} ${ri.racha === 1 ? 'día' : 'días'}</span></button>
    <button class="reto-card examen-card" id="examen"><span><b>📝 Modo examen</b><br>15 preguntas sin ayuda, como en el colegio · calificación al final</span><span class="racha">${E.examenes.length ? `${Math.max(...E.examenes.map((x) => x.nota))}/15` : '¡Pruébalo!'}</span></button>
    <h2>🔢 Matemáticas</h2><div class="grid">${L.TEMAS.filter((t) => t.materia === 'mate').map(tarjeta).join('')}</div>
    <h2>📖 Comunicación y Lenguaje</h2><div class="grid">${L.TEMAS.filter((t) => t.materia === 'leng').map(tarjeta).join('')}</div>
    <p style="margin-top:30px"><button class="link" id="papa">Para papá y mamá</button></p>
    <p class="nota">${GUARDA ? '✓ Tu avance se guarda solo en este aparato.' : '⚠️ Este navegador no está guardando el avance. Revisa que no esté en modo privado.'}</p>`;
  app.querySelectorAll('.tema').forEach((b) => b.onclick = () => aprende(L.TEMAS.find((t) => t.id === b.dataset.id)));
  $('#papa').onclick = papa; $('#reto').onclick = reto; $('#mision').onclick = mision; $('#examen').onclick = examenes;
  scrollTo(0, 0);
}

// ---------- Reto del día: tablas con repaso espaciado ----------
const hoyStr = () => new Date().toLocaleDateString('en-CA');
function retoInfo() {
  const r = E.reto, h = hoyStr();
  return { racha: L.reto.racha(r.dias, h), hecho: r.dias.includes(h), dom: L.reto.HECHOS.filter((k) => (r.est[k] || {}).caja >= 3).length, vistas: L.reto.HECHOS.filter((k) => r.est[k]).length };
}
function mapa() {
  const filas = [2, 3, 4, 5, 6, 7, 8, 9, 10].map((a) => `<tr><th>×${a}</th>${Array.from({ length: 10 }, (_, i) => {
    const h = E.reto.est[`${a}x${i + 1}`];
    return `<td class="${h ? 'c' + h.caja : ''}" title="${a} × ${i + 1}"></td>`;
  }).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto"><table class="mapa" aria-label="Mapa de tablas"><tr><th></th>${Array.from({ length: 10 }, (_, i) => `<th>${i + 1}</th>`).join('')}</tr>${filas}</table></div>
    <div class="leyenda"><span style="--c:var(--track)">Nueva</span><span style="--c:var(--bad)">Falló</span><span style="--c:var(--star)">Aprendiendo</span><span style="--c:var(--ok)">¡Ya la sabe!</span></div>`;
}

function reto() {
  const h = hoyStr(), cola = L.reto.elegirReto(E.reto.est, h).map((k) => ({ k, repaso: false }));
  const R = { total: cola.length, n: 0, bien: 0, rapidas: 0, inicio: Date.now() };
  const sig = () => {
    if (R.fuera) return;
    if (!cola.length) return retoFinal(R);
    const q = cola.shift(), [a, b] = q.k.split('x').map(Number);
    const falta = !q.repaso && Math.random() < 0.25, resp = falta ? b : a * b, t0 = Date.now();
    if (!q.repaso) R.n++;
    let val = '';
    app.innerHTML = `
      <button class="link" id="volver">← Salir</button>
      <h1>⚡ Reto del día</h1>
      <p>${q.repaso ? '🔁 <b>Otra vez la que fallaste.</b> ¡Tú puedes!' : `Pregunta ${R.n} de ${R.total}`}</p>
      <div class="panel">
        <div class="reto-q">${falta ? `${a} × ? = ${a * b}` : `${a} × ${b} = ?`}</div>
        <div class="ayudas" style="justify-content:center">${botonVoz}</div>
        <div class="tiempo" aria-hidden="true"><i></i></div>
        <div class="pantalla" id="pant" aria-live="polite"></div>
        <div class="teclado" id="tec">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button data-d="${d}">${d}</button>`).join('')}<button class="borra" data-d="x" aria-label="Borrar">⌫</button><button data-d="0">0</button><button class="listo" data-d="ok">Listo</button></div>
        <div id="fb"></div>
      </div>`;
    $('#volver').onclick = () => { R.fuera = true; document.onkeydown = null; inicio(); };
    $('#voz').onclick = () => hablar(falta ? `${a} por cuánto es igual a ${a * b}` : `${a} por ${b}`);
    const pinta = () => { $('#pant').textContent = val; };
    let hecho = false;
    const revisar = () => {
      if (hecho || !val) return; hecho = true;
      const ok = +val === resp, rapida = ok && Date.now() - t0 < 6000;
      if (!q.repaso) {
        E.reto.est[q.k] = L.reto.responder(E.reto.est[q.k], ok, h);
        if (ok) { R.bien++; E.estrellas++; } if (rapida) R.rapidas++;
        if (!ok) cola.push({ k: q.k, repaso: true });
      }
      guardar();
      app.querySelectorAll('#tec button').forEach((x) => x.disabled = true);
      $('#fb').innerHTML = ok
        ? `<div class="fb ok"><b>${rapida ? '¡Rapidísimo! ⚡' : pick(BIEN)}</b> ${a} × ${b} = ${a * b}</div>`
        : `<div class="fb mal"><b>${pick(CASI)}</b><p class="grande">${a} × ${b} = ${a * b}</p><p>${L.reto.truco(a, b)}</p></div>
           <div class="acciones"><button class="btn" id="sig">Siguiente →</button></div>`;
      if (ok) setTimeout(sig, 900); else { $('#sig').onclick = sig; $('#sig').focus(); }
    };
    $('#tec').onclick = (e) => {
      const d = e.target.closest('button')?.dataset.d; if (!d || hecho) return;
      if (d === 'ok') return revisar();
      val = d === 'x' ? val.slice(0, -1) : (val + d).slice(0, 3); pinta();
    };
    document.onkeydown = (e) => {
      if (!$('#tec') || hecho) return;
      if (/^[0-9]$/.test(e.key)) { val = (val + e.key).slice(0, 3); pinta(); }
      else if (e.key === 'Backspace') { val = val.slice(0, -1); pinta(); }
      else if (e.key === 'Enter') revisar();
    };
  };
  sig();
}

function retoFinal(R) {
  document.onkeydown = null;
  marcaMision('reto');
  const h = hoyStr();
  if (!E.reto.dias.includes(h)) E.reto.dias.push(h);
  E.reto.hist.push({ fecha: new Date().toISOString(), bien: R.bien, de: R.total, rapidas: R.rapidas, seg: Math.round((Date.now() - R.inicio) / 1000) });
  guardar();
  const ri = retoInfo();
  const msg = R.bien === R.total ? '¡PERFECTO! 🏆' : R.bien >= 8 ? '¡Excelente! Tu memoria está creciendo 🧠' : '¡Bien hecho por practicar! Mañana te salen mejor 💛';
  app.innerHTML = `
    <h1>⚡ Reto del día</h1>
    <div class="panel" style="text-align:center">
      <p class="grande">${R.bien} de ${R.total} a la primera</p>
      <p>⚡ ${R.rapidas} rápidas · 🔥 racha de ${ri.racha} ${ri.racha === 1 ? 'día' : 'días'}</p>
      <p><b>${msg}</b></p>
      <h2>Tu mapa de tablas</h2><p>Practicaste <b>${ri.vistas} de 90</b> · ya te sabes <b>${ri.dom}</b>. Cada tabla se pone verde cuando la aciertas 3 días.</p>
      ${mapa()}
      <p>Las que fallaste te van a salir mañana otra vez. ¡Así se quedan en la memoria!</p>
    </div>
    <div class="acciones">${botonMision()}<button class="btn" id="otra">Otra vuelta 🔁</button><button class="btn sec" id="inicio">Inicio 🏠</button></div>`;
  if (R.bien >= 8) fiesta(R.bien === R.total ? 60 : 30);
  if ($('#amision')) $('#amision').onclick = mision;
  $('#otra').onclick = reto; $('#inicio').onclick = inicio;
  scrollTo(0, 0);
}

// ---------- Misión del día: 3 pasos cortos para no tener que escoger ----------
function temaDelDia() {
  const urg = L.TEMAS.filter((t) => t.urge && t.id !== 'mental');
  return urg.reduce((m, t) => (avance(t.id) < avance(m.id) ? t : m), urg[0]);
}
function hoyMision() {
  const h = hoyStr();
  if (!E.mision || E.mision.fecha !== h) { E.mision = { fecha: h, tema: temaDelDia().id, hechos: [] }; guardar(); }
  return E.mision;
}
function pasosMision(m) {
  const t = L.TEMAS.find((x) => x.id === m.tema), mental = L.TEMAS.find((x) => x.id === 'mental');
  return [
    { id: 'tema', txt: `${t.emoji} Aprende y practica: <b>${t.nombre}</b>`, go: () => aprende(t) },
    { id: 'mental', txt: '🧠 5 sumas en la mente, <b>sin dedos</b>', go: () => practica(mental) },
    { id: 'reto', txt: '⚡ Reto de tablas', go: reto },
  ];
}
function marcaMision(id) {
  const m = hoyMision();
  if (!m.hechos.includes(id)) m.hechos.push(id);
  if (m.hechos.length === 3 && !m.cumplida) { m.cumplida = true; m.nueva = true; E.misiones = (E.misiones || 0) + 1; }
  guardar();
}
const botonMision = () => (E.mision && E.mision.fecha === hoyStr() && E.mision.hechos.length < 3) || (E.mision && E.mision.nueva) ? '<button class="btn" id="amision">🗺️ Volver a mi misión</button>' : '';
function mision() {
  const m = hoyMision(), pasos = pasosMision(m), toca = pasos.findIndex((p) => !m.hechos.includes(p.id));
  app.innerHTML = `
    <button class="link" id="volver">← Volver</button>
    <h1>🗺️ Misión del día</h1>
    <p>${m.cumplida ? '' : 'Son 3 pasos cortos, unos 15 minutos. ¡Vamos paso por paso!'}</p>
    ${m.cumplida ? `<div class="panel" style="text-align:center"><p class="grande">🏆 ¡Misión cumplida!</p><p>Llevas <b>${E.misiones}</b> ${E.misiones === 1 ? 'misión cumplida' : 'misiones cumplidas'}. ¡Eres constante y eso te hace más inteligente! 💛</p><p>Pídele a papá o mamá tu premio. Mañana hay una misión nueva.</p></div>` : ''}
    <div class="grid" style="margin-top:14px">${pasos.map((p, k) => `<button class="tema" data-k="${k}" ${!m.cumplida && k !== toca ? 'style="opacity:.6"' : ''}>
      <span class="e">${m.hechos.includes(p.id) ? '✅' : k === toca ? '👉' : '⏳'}</span><span>Paso ${k + 1}: ${p.txt}</span></button>`).join('')}</div>`;
  if (m.nueva) { fiesta(60); m.nueva = false; guardar(); }
  $('#volver').onclick = inicio;
  app.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => pasos[+b.dataset.k].go());
  scrollTo(0, 0);
}

// ---------- Modo examen ----------
function examenes() {
  const mejor = (id) => { const xs = E.examenes.filter((x) => x.id === id); return xs.length ? `Mejor nota: ${Math.max(...xs.map((x) => x.nota))}/15` : 'Todavía no lo haces'; };
  app.innerHTML = `
    <button class="link" id="volver">← Volver</button>
    <h1>📝 Modo examen</h1>
    <p>Como en el colegio: <b>no hay ayuda</b> hasta el final. Lee despacio y piensa en tu mente antes de responder.</p>
    <div class="grid">
      <button class="tema" id="ex1"><span class="e">📄</span><b>${L.examenes.EXAMEN_1.nombre}</b><small>La misma de la hoja impresa · ${mejor('hoja1')}</small></button>
      <button class="tema" id="exs"><span class="e">🎲</span><b>Examen sorpresa</b><small>3 temas al azar, siempre distinto · ${mejor('sorpresa')}</small></button>
    </div>`;
  $('#volver').onclick = inicio;
  $('#ex1').onclick = () => examen(L.examenes.EXAMEN_1);
  $('#exs').onclick = () => examen(L.examenes.examenSorpresa());
  scrollTo(0, 0);
}

function examen(ex) {
  const lista = ex.series.flatMap((s, si) => s.preguntas.map((q) => ({ ...q, si })));
  const R = { ex, lista, resp: [], inicio: Date.now() };
  const mostrar = (i) => {
    if (i === lista.length) return examenFinal(R);
    const q = lista[i];
    let sel = null;
    app.innerHTML = `
      <button class="link" id="volver">← Salir del examen</button>
      <h1>📝 ${ex.series[q.si].nombre}</h1>
      <p>Pregunta ${i + 1} de ${lista.length}</p>
      <div class="puntos">${lista.map((_, k) => `<span class="${k < i ? 'r' : k === i ? 'ya' : ''}"></span>`).join('')}</div>
      <div class="panel">
        <div>${q.texto}</div>
        <div class="ayudas">${botonVoz}</div>
        ${q.opciones ? `${q.numero ? '<p><b>1. ¿Qué operación es?</b></p>' : ''}${q.opciones.map((o) => `<button class="op">${o}</button>`).join('')}` : ''}
        ${!q.opciones || q.numero ? `${q.numero ? '<p><b>2. ¿Cuál es la respuesta?</b></p>' : ''}<input class="num" id="n" inputmode="numeric" autocomplete="off" aria-label="Tu respuesta">` : ''}
        <div class="acciones"><button class="btn" id="sig" disabled>${i + 1 === lista.length ? 'Terminar examen 🏁' : 'Siguiente →'}</button></div>
      </div>`;
    $('#volver').onclick = examenes;
    $('#voz').onclick = () => hablar(q.texto + (q.opciones ? '. Opciones: ' + q.opciones.join(', ') : ''));
    const n = $('#n');
    const listo = () => { $('#sig').disabled = !((!q.opciones || sel) && (!n || n.value.trim())); };
    app.querySelectorAll('.op').forEach((b) => b.onclick = () => { app.querySelectorAll('.op').forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); sel = b.textContent; listo(); });
    if (n) { n.oninput = listo; n.onkeydown = (e) => { if (e.key === 'Enter' && !$('#sig').disabled) $('#sig').click(); }; if (!q.opciones) n.focus(); }
    $('#sig').onclick = () => {
      const num = n ? n.value.trim() : '';
      const ok = q.opciones ? sel === q.respuesta && (!q.numero || +num === +q.numero) : num.toLowerCase() === q.respuesta.toLowerCase();
      R.resp.push({ ok, dada: [sel, num].filter(Boolean).join(' · ') });
      mostrar(i + 1);
    };
    scrollTo(0, 0);
  };
  mostrar(0);
}

function examenFinal(R) {
  const { ex, lista, resp } = R, nota = resp.filter((r) => r.ok).length;
  const series = ex.series.map((s, si) => ({ nombre: s.nombre, tema: s.tema, bien: resp.filter((r, k) => lista[k].si === si && r.ok).length, de: s.preguntas.length }));
  E.examenes.push({ fecha: new Date().toISOString(), id: ex.id, nombre: ex.nombre, nota, de: lista.length, series: series.map((s) => `${s.nombre.split(':')[0]}: ${s.bien}/${s.de}`), seg: Math.round((Date.now() - R.inicio) / 1000) });
  E.estrellas += nota; guardar();
  const malas = lista.map((q, k) => ({ q, r: resp[k] })).filter((x) => !x.r.ok);
  app.innerHTML = `
    <h1>📝 ${ex.nombre}</h1>
    <div class="panel" style="text-align:center">
      <p class="grande">${nota} de ${lista.length}</p>
      <p style="font-size:24px"><b>${L.examenes.notaMensaje(nota, lista.length)}</b></p>
      <p>Ganaste ⭐ ${nota} estrellas.</p>
      <table class="papa">${series.map((s) => `<tr><td>${s.nombre}</td><td>${s.bien}/${s.de}</td><td>${s.bien < 4 ? `<button class="link" data-t="${s.tema}">Repasar este tema</button>` : '✅'}</td></tr>`).join('')}</table>
    </div>
    ${malas.length ? `<h2>Vamos a ver las que fallaste 👀</h2><div class="panel">${malas.map(({ q, r }) => `<div class="revision"><div>${q.texto}</div><p>Tu respuesta: <b>${r.dada || '—'}</b> · Correcta: <b>${q.respuesta}${q.numero ? ' · ' + q.numero : ''}</b></p><p>${q.explica}</p></div>`).join('')}</div>` : ''}
    <div class="acciones"><button class="btn" id="otro">Otro examen 📝</button><button class="btn sec" id="inicio">Inicio 🏠</button></div>`;
  if (nota >= lista.length - 2) fiesta(60); else if (nota >= lista.length - 5) fiesta(30);
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => aprende(L.TEMAS.find((t) => t.id === b.dataset.t)));
  $('#otro').onclick = examenes; $('#inicio').onclick = inicio;
  scrollTo(0, 0);
}

function aprende(t) {
  app.innerHTML = `
    <button class="link" id="volver">← Volver</button>
    <h1>${t.emoji} ${t.nombre}</h1>
    <div class="panel">
      ${t.video ? `<video id="vid" src="${t.video}" controls playsinline preload="metadata"></video>` : ''}
      ${t.aprende}
    </div>
    <div class="acciones"><button class="btn ${t.materia === 'leng' ? 'leng' : ''}" id="ya">¡A practicar! 💪</button></div>`;
  const v = $('#vid'); if (v) v.onerror = () => v.remove();
  $('#volver').onclick = inicio; $('#ya').onclick = () => practica(t);
  scrollTo(0, 0);
}

function practica(t) {
  const d = E.temas[t.id] || (E.temas[t.id] = { mejor: 0 });
  const R = { t, i: 0, bien: 0, marcas: [], inicio: Date.now(), antes: d.mejor, fila: null };
  // cada respuesta se guarda al momento: si sale a medias, no pierde nada
  const anota = () => {
    d.mejor = Math.max(d.mejor, R.bien);
    if (!R.fila) E.historial.push(R.fila = { fecha: new Date().toISOString(), tema: t.id });
    Object.assign(R.fila, { bien: R.bien, de: R.i, seg: Math.round((Date.now() - R.inicio) / 1000) });
    guardar();
  };
  const vistos = new Set();
  const siguiente = () => {
    if (R.i === RONDA) return final(R);
    // no repetir la misma pregunta en la ronda
    let q; for (let k = 0; k < 40; k++) { q = t.gen(); if (!vistos.has(q.texto + q.respuesta)) break; }
    vistos.add(q.texto + q.respuesta);
    app.innerHTML = `
      <button class="link" id="volver">← Salir</button>
      <h1>${t.emoji} ${t.nombre}</h1>
      <div class="puntos">${Array.from({ length: RONDA }, (_, k) => `<span class="${R.marcas[k] || (k === R.i ? 'ya' : '')}"></span>`).join('')}</div>
      <div class="panel">
        <div>${q.texto}</div>
        <div class="ayudas">${botonVoz}${q.pista ? '<button class="btn sec pistab" id="pistab">💡 Pista</button>' : ''}</div>
        <div id="pistatxt"></div>
        <div id="resp">${q.opciones ? q.opciones.map((o) => `<button class="op">${o}</button>`).join('') :
          `<form id="f" style="margin-top:14px"><input class="num" id="n" inputmode="numeric" autocomplete="off" aria-label="Tu respuesta"> <button class="btn">Revisar</button></form>`}</div>
        <div id="fb"></div>
      </div>`;
    $('#volver').onclick = inicio;
    $('#voz').onclick = () => hablar(q.texto + (q.opciones ? '. Opciones: ' + q.opciones.join(', ') : ''));
    if ($('#pistab')) $('#pistab').onclick = () => { $('#pistatxt').innerHTML = `<div class="pista">💡 ${q.pista}</div>`; $('#pistab').disabled = true; };
    const revisar = (dada, boton) => {
      const ok = dada.trim().toLowerCase() === q.respuesta.toLowerCase();
      R.marcas[R.i] = ok ? 'ok' : 'mal';
      if (ok) { R.bien++; E.estrellas++; }
      app.querySelectorAll('.op').forEach((b) => { b.disabled = true; if (b.textContent === q.respuesta) b.classList.add('ok'); });
      if (boton && !ok) boton.classList.add('mal');
      const inp = $('#n'); if (inp) inp.disabled = true;
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'mal'}"><b>${ok ? pick(BIEN) : pick(CASI)}</b>${ok ? `<p>${q.explica}</p>` : `<p>Tú pusiste <b>${dada.trim() || '—'}</b>, pero la respuesta es <b>${q.respuesta}</b>.</p><p><b>Así se hace:</b><br>${q.explica}</p>`}</div>
        <div class="acciones"><button class="btn" id="sig">${R.i + 1 === RONDA ? 'Ver mi resultado 🏁' : 'Siguiente →'}</button></div>`;
      R.i++; anota(); $('#sig').onclick = siguiente; $('#sig').focus();
    };
    app.querySelectorAll('.op').forEach((b) => b.onclick = () => revisar(b.textContent, b));
    const f = $('#f'); if (f) { $('#n').focus(); f.onsubmit = (e) => { e.preventDefault(); if ($('#n').value.trim()) revisar($('#n').value); }; }
  };
  siguiente();
}

function final(R) {
  const { t, bien } = R, nuevo = bien > R.antes;
  if (t.id === hoyMision().tema) marcaMision('tema');
  if (t.id === 'mental') marcaMision('mental');
  const msg = bien === RONDA ? '¡PERFECTO! Eres una campeona 🏆' : bien >= RONDA - 1 ? '¡Muy bien! Ya casi lo dominas 🌟' : bien >= Math.ceil(RONDA / 2) ? '¡Vas mejorando! Una ronda más y lo logras 💪' : 'Cada intento te hace más fuerte. ¡Otra vez! 💛';
  app.innerHTML = `
    <h1>${t.emoji} ${t.nombre}</h1>
    <div class="panel" style="text-align:center">
      <p class="grande">${bien} de ${RONDA}</p><p style="font-size:34px">${'⭐'.repeat(bien) || '💛'}</p>
      <p><b>${msg}</b></p>${nuevo && bien < RONDA ? '<p>🎯 ¡Nuevo récord en este tema!</p>' : ''}
      <div class="barra"><i style="width:${avance(t.id)}%"></i></div><p>${avance(t.id)}% de este tema</p>
    </div>
    <div class="acciones">${botonMision()}<button class="btn" id="otra">Otra ronda 🔁</button><button class="btn sec" id="aprende">Ver la explicación</button><button class="btn sec" id="inicio">Inicio 🏠</button></div>`;
  if (bien >= RONDA - 1) fiesta(bien === RONDA ? 60 : 30);
  if ($('#amision')) $('#amision').onclick = mision;
  $('#otra').onclick = () => practica(t); $('#aprende').onclick = () => aprende(t); $('#inicio').onclick = inicio;
}

function papa() {
  const nombre = (id) => (L.TEMAS.find((t) => t.id === id) || {}).nombre || id;
  const filas = E.historial.slice().reverse().map((h) => {
    const f = new Date(h.fecha);
    return `<tr><td>${f.toLocaleDateString('es-GT')} ${f.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' })}</td><td>${nombre(h.tema)}</td><td>${h.bien}/${h.de}</td><td>${Math.max(1, Math.round(h.seg / 60))} min</td></tr>`;
  }).join('');
  const hoy = new Date().toDateString(), deHoy = E.historial.filter((h) => new Date(h.fecha).toDateString() === hoy);
  app.innerHTML = `
    <button class="link" id="volver">← Volver</button>
    <h1>Para papá y mamá</h1>
    <div class="panel">
      <p><b>Hoy:</b> ${deHoy.length} rondas, ${deHoy.reduce((s, h) => s + h.bien, 0)} aciertos, ${Math.round(deHoy.reduce((s, h) => s + h.seg, 0) / 60)} min.</p>
      <p><b>Avance general:</b> ${general()}% · <b>Estrellas:</b> ${E.estrellas}</p>
      <p>🗺️ Misiones cumplidas: <b>${E.misiones || 0}</b>${E.mision && E.mision.fecha === hoyStr() ? ` · Hoy: ${E.mision.hechos.length} de 3 pasos` : ''}</p>
      <h2>⚡ Reto de tablas</h2>
      ${(() => { const ri = retoInfo(), fall = Object.entries(E.reto.est).filter(([, v]) => v.mal > 0).sort((x, y) => y[1].mal - x[1].mal).slice(0, 5);
        const ult = E.reto.hist.slice(-5).reverse().map((r) => `<tr><td>${new Date(r.fecha).toLocaleDateString('es-GT')}</td><td>${r.bien}/${r.de}</td><td>⚡ ${r.rapidas}</td><td>${Math.max(1, Math.round(r.seg / 60))} min</td></tr>`).join('');
        return `<p>🔥 Racha: <b>${ri.racha}</b> · Domina <b>${ri.dom} de 90</b> tablas · Retos hechos: <b>${E.reto.hist.length}</b></p>
          ${fall.length ? `<p><b>Las que más se le olvidan:</b> ${fall.map(([k, v]) => `${k.replace('x', ' × ')} (${v.mal})`).join(' · ')}</p>` : ''}
          ${mapa()}
          ${ult ? `<table class="papa"><tr><th>Día</th><th>A la primera</th><th>Rápidas</th><th>Tiempo</th></tr>${ult}</table>` : ''}`; })()}
      <h2>📝 Exámenes</h2>
      ${E.examenes.length ? `<table class="papa"><tr><th>Día</th><th>Examen</th><th>Nota</th><th>Por serie</th></tr>${E.examenes.slice().reverse().map((x) => `<tr><td>${new Date(x.fecha).toLocaleDateString('es-GT')}</td><td>${x.nombre}</td><td><b>${x.nota}/${x.de}</b></td><td>${x.series.join(' · ')}</td></tr>`).join('')}</table>` : '<p>Todavía no hace exámenes.</p>'}
      <h2>Temas</h2>
      <table class="papa"><tr><th>Tema</th><th>Avance</th></tr>${L.TEMAS.map((t) => `<tr><td>${t.emoji} ${t.nombre}</td><td>${avance(t.id)}%</td></tr>`).join('')}</table>
      <h2>Historial</h2>
      ${filas ? `<table class="papa"><tr><th>Cuándo</th><th>Tema</th><th>Aciertos</th><th>Tiempo</th></tr>${filas}</table>` : '<p>Todavía no hay rondas.</p>'}
      <p style="margin-top:20px"><button class="link" id="borrar">Borrar todo el avance</button></p>
      <div id="seguro" hidden><p><b>¿Seguro? Se borran las estrellas y el historial de Victoria en este aparato.</b></p>
        <div class="acciones"><button class="btn peligro" id="si">Sí, borrar</button><button class="btn sec" id="no">No, dejarlo</button></div></div>
    </div>`;
  $('#volver').onclick = inicio;
  $('#borrar').onclick = () => { $('#seguro').hidden = false; };
  $('#no').onclick = () => { $('#seguro').hidden = true; };
  $('#si').onclick = () => { E = { temas: {}, estrellas: 0, historial: [], reto: { est: {}, dias: [], hist: [] }, examenes: [] }; guardar(); papa(); };
}

guardar(); // revisa si este navegador sí guarda
inicio();
</script>
</body>
</html>
